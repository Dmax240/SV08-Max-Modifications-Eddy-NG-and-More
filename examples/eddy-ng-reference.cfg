# REFERENCE ONLY — compare with the exact Eddy-NG revision you installed.
# SV08 MAX only. Replace YOUR_TOOLHEAD_CAN_UUID with your own live UUID.

[mcu extra_mcu]
canbus_uuid: YOUR_TOOLHEAD_CAN_UUID

# The documented sensor used an LDC1612 on extra_mcu I2C2.
# Option names below are intentionally an outline; use the installed
# Eddy-NG project's current example for the complete section syntax.
#
# sensor: ldc1612
# i2c_mcu: extra_mcu
# i2c_bus: i2c2
# x_offset: -19.8
# y_offset: -0.75
# home_trigger_height: 2.0
# tap_target_z: -0.40
# tap_samples: 3
# tap_max_samples: 5
# tap_samples_stddev: 0.025
# tap_mode: butter
# tap_threshold: 250

