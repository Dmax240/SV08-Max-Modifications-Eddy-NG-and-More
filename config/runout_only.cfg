# Stock SV08 Max buffer MCU used only as a filament runout input.
# The buffer motor, push pin, jam logic, and feeder LEDs are intentionally absent.

[mcu buffer_mcu]
canbus_uuid: YOUR_BUFFER_MCU_CAN_UUID

[filament_switch_sensor filament_sensor]
pause_on_runout: false
switch_pin: ^buffer_mcu:PA10
event_delay: 0.1
runout_gcode:
    M600
    RESPOND TYPE=error MSG="Filament runout detected"
insert_gcode:
    RESPOND TYPE=echo MSG="Filament detected"
